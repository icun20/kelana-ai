<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KelanaAI - AI Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: '#e2e8f0', // light gray/periwinkle feel
                        carbon: '#1e293b', // dark for command layer
                        'chrome-indigo': '#cbd5e1',
                        signal: '#ef4444', // red for action
                        'nav-gold': '#fbbf24',
                        amber: '#f59e0b',
                    },
                    fontFamily: {
                        sans: ['Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f1f5f9;
        }
        .bevel-plate {
            background-color: #e2e8f0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #94a3b8;
            border-bottom: 2px solid #94a3b8;
            box-shadow: 2px 2px 0px 0px #cbd5e1;
        }
        .bevel-plate-dark {
            background-color: #1e293b;
            border-top: 2px solid #334155;
            border-left: 2px solid #334155;
            border-right: 2px solid #0f172a;
            border-bottom: 2px solid #0f172a;
            color: white;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col font-sans">

        <header class="bevel-plate-dark p-4 flex flex-col md:flex-row justify-between items-center">
        <h1 class="text-2xl font-bold tracking-tight text-white mb-2 md:mb-0">
            <span class="text-nav-gold">KELANA</span>AI
        </h1>
        <nav class="flex gap-4 uppercase text-xs font-bold tracking-wider">
            <a href="#" class="text-nav-gold hover:text-amber">Home</a>
            <a href="#" class="text-gray-300 hover:text-white">Destinations</a>
            <a href="#" class="text-gray-300 hover:text-white">About</a>
        </nav>
    </header>

        <main class="flex-grow container mx-auto p-4 md:p-8 max-w-4xl">
        
                <section class="bevel-plate mb-8 p-1 relative overflow-hidden bg-slate-300">
                        <div class="relative w-full h-64 md:h-80 bg-slate-700 overflow-hidden border-2 border-slate-400">
                <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&q=80&w=1200&h=400" alt="Paris Destination" class="w-full h-full object-cover opacity-80 mix-blend-overlay">
                <div class="absolute inset-0 bg-blue-900/30"></div>
                
                <div class="absolute bottom-6 left-6">
                    <h2 class="text-4xl md:text-5xl font-extrabold text-white uppercase tracking-tighter" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
                        START YOUR JOURNEY
                    </h2>
                </div>
            </div>
        </section>

                <section class="bevel-plate p-6">
            <div class="bg-carbon text-white uppercase text-xs font-bold tracking-widest px-3 py-1 mb-4 inline-block border border-slate-600">
                PLANNER MODULE
            </div>

            <form class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex flex-col w-full">
                    <label for="destination" class="uppercase text-xs font-bold text-slate-700 mb-1">Destination</label>
                    <input type="text" id="destination" placeholder="e.g. Kyoto, Japan" class="p-2 border-2 border-slate-400 bg-slate-50 focus:outline-none focus:border-carbon rounded-none">
                </div>

                <div class="flex flex-col w-full md:w-32">
                    <label for="days" class="uppercase text-xs font-bold text-slate-700 mb-1">Days</label>
                    <input type="number" id="days" placeholder="3" min="1" class="p-2 border-2 border-slate-400 bg-slate-50 focus:outline-none focus:border-carbon rounded-none">
                </div>

                <div class="flex flex-col w-full md:w-48">
                    <label for="budget" class="uppercase text-xs font-bold text-slate-700 mb-1">Budget (USD)</label>
                    <input type="number" id="budget" placeholder="1000" min="1" class="p-2 border-2 border-slate-400 bg-slate-50 focus:outline-none focus:border-carbon rounded-none">
                </div>

                <button type="button" class="w-full md:w-auto bg-signal hover:bg-red-600 text-white font-bold uppercase text-sm py-2 px-6 border-2 border-red-800 shadow-[2px_2px_0px_#7f1d1d] active:shadow-none active:translate-y-0.5 active:translate-x-0.5 transition-all">
                    Generate
                </button>
            </form>
        </section>

    </main>

        <footer class="bevel-plate-dark mt-auto p-6 flex flex-col md:flex-row justify-between items-center text-xs">
        <div class="flex items-center gap-2 mb-4 md:mb-0">
            <div class="bg-amber text-carbon px-2 py-0.5 font-bold rounded-sm border border-orange-600">
                SYSTEM OK
            </div>
            <span class="text-slate-400">&copy; 2026 KelanaAI Network</span>
        </div>
        
        <div class="flex gap-4 uppercase tracking-wider font-bold">
            <a href="#" class="text-slate-400 hover:text-nav-gold">Privacy Certified</a>
            <a href="#" class="text-slate-400 hover:text-nav-gold">Terms</a>
            <a href="#" class="text-slate-400 hover:text-nav-gold">Help</a>
        </div>
    </footer>

</body>
</html>
